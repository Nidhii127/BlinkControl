<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BlinkControl</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="popup shell">
      <h1>BlinkControl</h1>
      <p>Open extension dashboard, grant camera access, and start local gesture control.</p>
      <button id="open-controller" class="btn btn-primary">Open Dashboard</button>
      <ul class="howto">
        <li>Pinch -> Click</li>
        <li>Double Blink -> New Tab</li>
        <li>Right Wink -> Close Tab</li>
        <li>Long Blink -> Reload</li>
      </ul>
    </main>
    <script type="module" src="./popup.js"></script>
  </body>
</html>
